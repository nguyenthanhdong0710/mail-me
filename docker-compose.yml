services:
  mail-me:
    build: .
    image: mail-me:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
    # Keep storage.path ("data/mail-me.db") and auth.grants_dir ("data/grants") at their
    # defaults so the database and the OAuth sign-ins land in the ./data volume. Back it up and
    # keep it private: the grants are secrets.
    #
    # Containers run in UTC. Set "timezone" in config.json (or TZ below) so meeting times are
    # right.
    # environment:
    #   TZ: Asia/Ho_Chi_Minh
    #
    # One-time OAuth sign-in for a Gmail account (the browser may be on another machine):
    #   docker compose run --rm -p 127.0.0.1:53682:53682 mail-me auth <account-id> --listen 0.0.0.0
    # Microsoft accounts use a device code and need no port:
    #   docker compose run --rm mail-me auth <account-id>

  # Local IMAP + SMTP server for `npm run test:e2e` only:
  #   docker compose --profile test up -d greenmail
  greenmail:
    image: greenmail/standalone:2.1.3
    profiles: ["test"]
    ports:
      - "3025:3025" # SMTP
      - "3143:3143" # IMAP
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users.login=email
        -Dgreenmail.users=student:secret@university.edu,me:secret@primary.example
